<form  method="post">
    {%csrf_token%}
    {% for field in form %}
    <div>
        <label for="">{{field.label}}</label>
        {{field}}

        {% for error in field.errors%}
        <p style="color: red;">{{error}}</p>
        {% endfor %}
    </div>
    {% endfor %}

    <button type="submit">{{operation}}</button>
</form>
