{% extends 'base.html' %}
{% load static %}

{% block title %}Tasks{% endblock title %}


{% block taskfield %}

<div class="main-container">
    <form action="" method="post">
        {% csrf_token %}

        {{form}}

        <button type="submit">Add task</button>
    </form>
</div>



<div class="cards">
    {% for task in tasks %}
    <div class="card">
        <div class="head">
            {{task.task_name}}
        </div>
        <div class="description">
            {{task.task_description}}
        </div>
         <div class="status">
            {{task.status}}
        </div>

        <div class="btn">
            <button><a href="{% url 'update' task.id %}">update</a></button>
            <button><a href="{% url 'delete' task.id %}">Delete</a></button>
        </div>
    </div>
    {% endfor %}
</div>
    
{% endblock taskfield %}
